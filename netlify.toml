[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

# POST /api/submit-lead: Next.js route is webhook-only (Sheets via /api/contact).
# For webhook-only function deploys (no Next.js API), uncomment:
# [[redirects]]
#   from = "/api/submit-lead"
#   to = "/.netlify/functions/submit-lead"
#   status = 200
#   force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"

# Canonical host: apex only
[[redirects]]
  from = "https://www.employeefraudexpert.com/*"
  to = "https://employeefraudexpert.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.employeefraudexpert.com/*"
  to = "https://employeefraudexpert.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://employeefraudexpert.com/*"
  to = "https://employeefraudexpert.com/:splat"
  status = 301
  force = true
